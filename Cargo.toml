[package]
name = "auri"
version = "0.2.0"
edition = "2021"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
license = "Apache-2.0"
description = "A terminal music player and audio visualizer"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6.2"
lofty = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
crossbeam-channel = "0.5"
unicode-width = "0.2"
notify-rust = "4.18"
