[package]
name = "bebop-player"
version = "1.0.0"
edition = "2021"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
license = "Apache-2.0"
description = "A terminal music player and audio visualizer"
repository = "https://github.com/pinkpixel-dev/bebop"
homepage = "https://pinkpixel.dev"
documentation = "https://docs.rs/bebop-player"
readme = "README.md"
keywords = ["music", "audio", "terminal", "tui", "visualizer"]
categories = ["command-line-utilities", "multimedia::audio"]

[lib]
name = "bebop"
path = "src/lib.rs"

[[bin]]
name = "bebop"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6.2"
lofty = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
crossbeam-channel = "0.5"
unicode-width = "0.2"
notify-rust = "4.18"
zbus = { version = "5.19", default-features = false, features = ["blocking-api"] }
